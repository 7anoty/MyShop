<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MyShop | متجر الزبون</title>
    <link rel="stylesheet" href="/shared/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/client/" aria-label="MyShop">
        <span class="mark">IZ</span>
        <span>IssamShop</span>
      </a>
      <nav class="nav" aria-label="Client navigation">
        <button data-scroll="home">الرئيسية</button>
        <button data-scroll="products">المنتجات</button>
        
      </nav>
    </header>

    <main>
      <section class="hero" id="home">
        <div>
          <span class="kicker">تجربة شراء سريعة وواضحة</span>
          <h1>منتجات مختارة بسعر واضح وتوصيل محسوب حسب ولايتك.</h1>

          <div class="actions">
            <button class="primary" data-scroll="products">تصفح المنتجات</button>
            <button class="ghost" data-scroll="contact">مساعدة</button>
          </div>
        </div>
        <img class="hero-media" src="https://images.unsplash.com/photo-1556742049-0cfed4f6a45d?auto=format&fit=crop&w=1200&q=82" alt="Shopping package" />
      </section>

      <section class="section" id="products">
        <div class="section-head">
          <div>
            <span class="kicker">المنتجات</span>
            <h2>كل منتج بسعره النهائي وتخفيضه</h2>
            <p class="muted">اضغط على المنتج لفتح صفحة تفاصيله، ثم اختر ولايتك وأرسل الطلب.</p>
          </div>
          <div class="filters">
            <input class="input" id="searchInput" placeholder="بحث عن منتج" />
            <select class="select" id="statePreview">
              <option value="">اختر الولاية</option>
            </select>
          </div>
        </div>
        <div class="grid" id="productsGrid"></div>
      </section>

      <section class="section hidden" id="productDetail"></section>

      
    </main>

    <div class="toast hidden" id="toast"></div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="/client/app.js"></script>
  </body>
</html>
